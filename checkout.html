<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="'Checkout | ' + (config.storeName || 'Ulti')">Checkout | Ulti</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-neutral-100 text-neutral-900 antialiased selection:bg-neutral-900 selection:text-white flex flex-col min-h-screen"
      x-data="storeApp()"
      x-init="initCheckoutPage()">

<!-- ===== HEADER (same style as about.html) ===== -->
<header class="fixed top-0 left-0 right-0 z-50 bg-neutral-950 transition-transform duration-300 ease-out"
        :class="headerHidden ? '-translate-y-full' : 'translate-y-0'">

    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between relative z-20">
        
        <!-- LEFT: Desktop Nav / Mobile Hamburger -->
        <div class="flex items-center w-1/3">
            <!-- Mobile Hamburger -->
            <button @click="mobileMenuOpen = !mobileMenuOpen" 
                    class="md:hidden text-white focus:outline-none p-1 transition-transform duration-300 active:scale-95">
                <svg class="w-6 h-6 transition-transform duration-300" 
                     :class="mobileMenuOpen ? 'rotate-90' : 'rotate-0'" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
                    <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex items-center space-x-8 text-sm font-bold tracking-[0.15em] uppercase text-white">
                <a href="index.html" class="hover:text-neutral-300 transition-colors">Shop</a>
                <a href="story.html" class="hover:text-neutral-300 transition-colors">Ulti Story</a>
                <a href="about.html" class="hover:text-neutral-300 transition-colors">About</a>
            </nav>
        </div>

        <!-- CENTER: Logo -->
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10">
            <a href="index.html" class="block transition-all duration-300 hover:opacity-80 hover:scale-105">
                <img :src="config.logo" 
                     :alt="config.storeName || 'Ulti'"
                     class="h-12 md:h-14 w-auto object-contain">
            </a>
        </div>

        <!-- RIGHT: Cart -->
        <div class="flex items-center justify-end w-1/3">
            <button @click="cartOpen = true" 
                    class="relative text-white transition-all duration-300 hover:text-neutral-300 hover:scale-110 active:scale-95 flex items-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
                <span class="absolute -top-1.5 -right-2 bg-white text-neutral-950 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center"
                      x-text="cartCount">0</span>
            </button>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div x-show="mobileMenuOpen" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 -translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-4"
         class="md:hidden absolute top-20 left-0 w-full bg-neutral-950 border-b border-neutral-800 px-6 py-6 shadow-xl"
         style="display: none;">
        <nav class="flex flex-col space-y-4 text-base font-bold tracking-[0.15em] uppercase text-white">
            <a href="index.html" @click="mobileMenuOpen = false" class="transition-colors hover:text-neutral-400 py-2 border-b border-neutral-800/50">Shop</a>
            <a href="story.html" @click="mobileMenuOpen = false" class="transition-colors hover:text-neutral-400 py-2 border-b border-neutral-800/50">Ulti Story</a>
            <a href="about.html" @click="mobileMenuOpen = false" class="transition-colors hover:text-neutral-400 py-2">About</a>
        </nav>
    </div>
</header>

<!-- ===== MAIN CHECKOUT CONTENT ===== -->
<main class="flex-grow pt-28 pb-16">
    <div class="max-w-5xl mx-auto px-6">

        <!-- Page Title -->
        <div class="relative flex py-5 items-center mb-10">
            <div class="flex-grow border-t border-neutral-400"></div>
            <span class="flex-shrink mx-6 text-xl md:text-2xl font-bold tracking-[0.25em] uppercase">Checkout</span>
            <div class="flex-grow border-t border-neutral-400"></div>
        </div>

        <!-- Empty Cart State -->
        <template x-if="cart.length === 0 && !orderSuccess">
            <div class="text-center py-20">
                <p class="text-neutral-500 mb-6 tracking-wide uppercase text-sm">Your cart is empty.</p>
                <a href="index.html" class="inline-block bg-neutral-900 text-white text-xs uppercase tracking-wider px-8 py-3 rounded-full font-medium hover:bg-neutral-800 transition-colors">
                    Continue Shopping
                </a>
            </div>
        </template>

        <!-- Success State -->
        <template x-if="orderSuccess">
            <div class="max-w-md mx-auto text-center py-16 space-y-6">
                <div class="w-16 h-16 bg-neutral-900 text-white rounded-full flex items-center justify-center mx-auto text-2xl">✓</div>
                <h2 class="text-xl font-bold tracking-wide uppercase">Order Submitted!</h2>
                <p class="text-sm text-neutral-600 leading-relaxed">
                    Naipadala na ang detalye ng order mo. Susuriin ng team ang payment at i-confirm ang delivery details mo.
                </p>
                <a href="index.html" class="inline-block mt-4 bg-neutral-900 text-white text-xs uppercase tracking-wider px-8 py-3 rounded-full font-medium hover:bg-neutral-800 transition-colors">
                    Back to Shop
                </a>
            </div>
        </template>

        <!-- Checkout Form + Order Summary (only when cart has items and not yet success) -->
        <template x-if="cart.length > 0 && !orderSuccess">
            <div class="grid grid-cols-1 lg:grid-cols-5 gap-10">

                <!-- LEFT: Form (3/5) -->
                <div class="lg:col-span-3 space-y-8">

                    <!-- 1. Customer Details -->
                    <section class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-neutral-200">
                        <h3 class="text-sm font-bold tracking-[0.2em] uppercase mb-6 text-neutral-900">1. Customer Details</h3>
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-neutral-600 mb-1.5">Full Name</label>
                                <input type="text" x-model="form.name" required
                                       class="w-full px-4 py-3 text-sm border border-neutral-200 rounded-xl focus:outline-none focus:border-neutral-900 transition-colors"
                                       placeholder="Juan Dela Cruz">
                            </div>
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-neutral-600 mb-1.5">Complete Delivery Address</label>
                                <textarea x-model="form.address" required rows="3"
                                          class="w-full px-4 py-3 text-sm border border-neutral-200 rounded-xl focus:outline-none focus:border-neutral-900 transition-colors"
                                          placeholder="House No., Street, Barangay, City, Province"></textarea>
                            </div>
                            <div>
                                <label class="block text-xs uppercase tracking-wider text-neutral-600 mb-1.5">Contact Number</label>
                                <input type="text" x-model="form.contact" required
                                       class="w-full px-4 py-3 text-sm border border-neutral-200 rounded-xl focus:outline-none focus:border-neutral-900 transition-colors"
                                       placeholder="09XX XXX XXXX">
                            </div>
                        </div>
                    </section>

                    <!-- 2. Delivery Option -->
                    <section class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-neutral-200">
                        <h3 class="text-sm font-bold tracking-[0.2em] uppercase mb-6 text-neutral-900">2. Delivery Option</h3>
                        
                        <div class="space-y-3">
                            <!-- Same Day Delivery -->
                            <label class="flex items-start gap-4 p-4 rounded-xl border-2 cursor-pointer transition-all"
                                   :class="form.deliveryOption === 'same_day' ? 'border-neutral-900 bg-neutral-50' : 'border-neutral-200 hover:border-neutral-400'">
                                <input type="radio" name="delivery" value="same_day" x-model="form.deliveryOption" class="mt-1 accent-neutral-900">
                                <div class="flex-1">
                                    <div class="flex items-center justify-between">
                                        <span class="text-sm font-bold uppercase tracking-wide">Same Day Delivery</span>
                                        <span class="text-xs font-medium text-neutral-600" x-text="config.currency + '150'"></span>
                                    </div>
                                    <p class="text-xs text-neutral-500 mt-1">Order before 12NN. Metro Manila / selected areas only. Subject to confirmation.</p>
                                </div>
                            </label>

                            <!-- Standard Delivery -->
                            <label class="flex items-start gap-4 p-4 rounded-xl border-2 cursor-pointer transition-all"
                                   :class="form.deliveryOption === 'standard' ? 'border-neutral-900 bg-neutral-50' : 'border-neutral-200 hover:border-neutral-400'">
                                <input type="radio" name="delivery" value="standard" x-model="form.deliveryOption" class="mt-1 accent-neutral-900">
                                <div class="flex-1">
                                    <div class="flex items-center justify-between">
                                        <span class="text-sm font-bold uppercase tracking-wide">Standard Delivery</span>
                                        <span class="text-xs font-medium text-neutral-600">Free / Courier rates apply</span>
                                    </div>
                                    <p class="text-xs text-neutral-500 mt-1">2–5 business days depending on location.</p>
                                </div>
                            </label>
                        </div>
                    </section>

                    <!-- 3. Payment Method -->
                    <section class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-neutral-200">
                        <h3 class="text-sm font-bold tracking-[0.2em] uppercase mb-6 text-neutral-900">3. Payment Method</h3>
                        
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-6">
                            <!-- GCash -->
                            <label class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all text-center"
                                   :class="form.paymentMethod === 'gcash' ? 'border-neutral-900 bg-neutral-50' : 'border-neutral-200 hover:border-neutral-400'">
                                <input type="radio" name="payment" value="gcash" x-model="form.paymentMethod" class="sr-only">
                                <span class="text-sm font-bold uppercase tracking-wide">GCash</span>
                            </label>

                            <!-- Maya -->
                            <label class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all text-center"
                                   :class="form.paymentMethod === 'maya' ? 'border-neutral-900 bg-neutral-50' : 'border-neutral-200 hover:border-neutral-400'">
                                <input type="radio" name="payment" value="maya" x-model="form.paymentMethod" class="sr-only">
                                <span class="text-sm font-bold uppercase tracking-wide">Maya</span>
                            </label>

                            <!-- Bank Transfer -->
                            <label class="flex flex-col items-center justify-center gap-2 p-4 rounded-xl border-2 cursor-pointer transition-all text-center"
                                   :class="form.paymentMethod === 'bank' ? 'border-neutral-900 bg-neutral-50' : 'border-neutral-200 hover:border-neutral-400'">
                                <input type="radio" name="payment" value="bank" x-model="form.paymentMethod" class="sr-only">
                                <span class="text-sm font-bold uppercase tracking-wide">Bank Transfer</span>
                            </label>
                        </div>

                        <!-- Payment Instructions (dynamic) -->
                        <div class="bg-neutral-50 rounded-xl p-5 text-sm space-y-2 border border-neutral-200" x-show="form.paymentMethod">
                            <template x-if="form.paymentMethod === 'gcash'">
                                <div>
                                    <p class="font-bold uppercase tracking-wide text-xs mb-2">GCash Payment Details</p>
                                    <p class="text-neutral-700">Send payment to: <strong>09XX XXX XXXX</strong></p>
                                    <p class="text-neutral-700">Account Name: <strong>ULTI</strong></p>
                                    <p class="text-xs text-neutral-500 mt-2">Please upload your GCash receipt after payment.</p>
                                </div>
                            </template>
                            <template x-if="form.paymentMethod === 'maya'">
                                <div>
                                    <p class="font-bold uppercase tracking-wide text-xs mb-2">Maya Payment Details</p>
                                    <p class="text-neutral-700">Send payment to: <strong>09XX XXX XXXX</strong></p>
                                    <p class="text-neutral-700">Account Name: <strong>ULTI</strong></p>
                                    <p class="text-xs text-neutral-500 mt-2">Please upload your Maya receipt after payment.</p>
                                </div>
                            </template>
                            <template x-if="form.paymentMethod === 'bank'">
                                <div>
                                    <p class="font-bold uppercase tracking-wide text-xs mb-2">Bank Transfer Details</p>
                                    <p class="text-neutral-700">Bank: <strong>BDO / BPI / Metrobank</strong></p>
                                    <p class="text-neutral-700">Account Name: <strong>ULTI</strong></p>
                                    <p class="text-neutral-700">Account Number: <strong>XXXX XXXX XXXX</strong></p>
                                    <p class="text-xs text-neutral-500 mt-2">Please upload your bank transfer receipt after payment.</p>
                                </div>
                            </template>
                        </div>

                        <!-- Upload Receipt -->
                        <div class="mt-6">
                            <label class="block text-xs uppercase tracking-wider text-neutral-600 mb-1.5">Upload Payment Receipt / Screenshot</label>
                            <input type="file" @change="handleFileUpload($event)" accept="image/*" required
                                   class="w-full text-xs text-neutral-500 file:mr-4 file:py-2.5 file:px-5 file:rounded-full file:border-0 file:text-xs file:font-medium file:bg-neutral-900 file:text-white hover:file:bg-neutral-800 cursor-pointer">
                        </div>
                    </section>

                    <!-- Submit Button (mobile) -->
                    <div class="lg:hidden">
                        <button @click="submitOrder()" 
                                :disabled="isSubmitting || !canSubmit"
                                class="w-full bg-neutral-900 text-white text-xs uppercase tracking-wider py-4 rounded-full font-medium hover:bg-neutral-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            <span x-show="!isSubmitting">Confirm & Submit Order</span>
                            <span x-show="isSubmitting">Sending Order...</span>
                        </button>
                    </div>
                </div>

                <!-- RIGHT: Order Summary (2/5) -->
                <div class="lg:col-span-2">
                    <div class="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-neutral-200 sticky top-28">
                        <h3 class="text-sm font-bold tracking-[0.2em] uppercase mb-6 text-neutral-900">Order Summary</h3>

                        <!-- Cart Items -->
                        <div class="space-y-4 mb-6 max-h-64 overflow-y-auto">
                            <template x-for="item in cart" :key="item.id">
                                <div class="flex items-center gap-3">
                                    <img :src="item.image_url || config.fallbackImage" 
                                         class="w-14 h-16 object-cover rounded-lg bg-neutral-100 flex-shrink-0"
                                         :alt="item.name">
                                    <div class="flex-1 min-w-0">
                                        <p class="text-sm font-medium truncate" x-text="item.name"></p>
                                        <p class="text-xs text-neutral-500">Qty: <span x-text="item.quantity"></span></p>
                                    </div>
                                    <p class="text-sm font-medium whitespace-nowrap" 
                                       x-text="config.currency + Number(item.price * item.quantity).toLocaleString()"></p>
                                </div>
                            </template>
                        </div>

                        <div class="border-t border-neutral-200 pt-4 space-y-2 text-sm">
                            <div class="flex justify-between">
                                <span class="text-neutral-600">Subtotal</span>
                                <span x-text="config.currency + Number(cartTotal).toLocaleString()"></span>
                            </div>
                            <div class="flex justify-between" x-show="form.deliveryOption === 'same_day'">
                                <span class="text-neutral-600">Same Day Delivery</span>
                                <span x-text="config.currency + '150'"></span>
                            </div>
                            <div class="flex justify-between font-bold text-base pt-2 border-t border-neutral-200">
                                <span>Total</span>
                                <span x-text="config.currency + Number(grandTotal).toLocaleString()"></span>
                            </div>
                        </div>

                        <!-- Desktop Submit -->
                        <button @click="submitOrder()" 
                                :disabled="isSubmitting || !canSubmit"
                                class="hidden lg:block w-full mt-6 bg-neutral-900 text-white text-xs uppercase tracking-wider py-4 rounded-full font-medium hover:bg-neutral-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                            <span x-show="!isSubmitting">Confirm & Submit Order</span>
                            <span x-show="isSubmitting">Sending Order...</span>
                        </button>

                        <p class="text-[11px] text-neutral-500 text-center mt-4 leading-relaxed">
                            By submitting, you agree that your order details will be sent for verification. Payment must be completed before processing.
                        </p>
                    </div>
                </div>
            </div>
        </template>
    </div>
</main>

<!-- Cart Slide-Over (reused) -->
<div x-show="cartOpen" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-hidden" 
     style="display: none;">

    <div @click="cartOpen = false" class="absolute inset-0 bg-neutral-900/50 backdrop-blur-sm"></div>

    <div class="absolute inset-y-0 right-0 max-w-full flex pl-10"
         x-show="cartOpen"
         x-transition:enter="transition transform ease-out duration-300"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition transform ease-in duration-200"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="translate-x-full">
        <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
            <div class="flex items-center justify-between px-6 py-6 border-b border-neutral-100">
                <h2 class="text-base font-medium tracking-wide uppercase">Your Cart (<span x-text="cartCount"></span>)</h2>
                <button @click="cartOpen = false" class="text-neutral-400 hover:text-neutral-900 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto px-6 py-6 space-y-6">
                <template x-for="item in cart" :key="item.id">
                    <div class="flex items-center space-x-4 border-b border-neutral-100 pb-4">
                        <img :src="item.image_url || config.fallbackImage" class="w-16 h-20 object-cover rounded bg-neutral-100">
                        <div class="flex-1">
                            <h4 class="text-sm font-medium text-neutral-900" x-text="item.name"></h4>
                            <p class="text-xs text-neutral-500 mt-1" x-text="config.currency + Number(item.price).toLocaleString()"></p>
                            <div class="flex items-center space-x-3 mt-2">
                                <button @click="updateQuantity(item.id, -1)" class="w-6 h-6 rounded border border-neutral-200 flex items-center justify-center text-xs hover:bg-neutral-100">-</button>
                                <span class="text-xs font-medium" x-text="item.quantity"></span>
                                <button @click="updateQuantity(item.id, 1)" class="w-6 h-6 rounded border border-neutral-200 flex items-center justify-center text-xs hover:bg-neutral-100">+</button>
                            </div>
                        </div>
                        <button @click="removeFromCart(item.id)" class="text-xs text-neutral-400 hover:text-neutral-900 transition-colors">Remove</button>
                    </div>
                </template>
                <div x-show="cart.length === 0" class="text-center py-12 text-neutral-400 text-sm">
                    Your cart is empty.
                </div>
            </div>
            
            <div class="border-t border-neutral-100 px-6 py-6 bg-neutral-50">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-sm text-neutral-600">Subtotal</span>
                    <span class="text-base font-semibold text-neutral-900" x-text="config.currency + Number(cartTotal).toLocaleString()"></span>
                </div>
                <a href="checkout.html" 
                   class="block w-full text-center bg-neutral-900 text-white text-xs uppercase tracking-wider py-4 rounded-full font-medium hover:bg-neutral-800 transition-colors"
                   :class="cart.length === 0 ? 'opacity-50 pointer-events-none' : ''">
                    Proceed to Checkout
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="border-t border-neutral-200 bg-neutral-100 mt-auto">
    <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-4">
        <p class="text-xs tracking-widest uppercase text-neutral-500 order-2 sm:order-1">
            &copy; 2026 <span x-text="config.storeName || 'Ulti'"></span>. All rights reserved.
        </p>
        <div class="flex items-center space-x-5 order-1 sm:order-2">
            <a :href="config.socials.facebook" target="_blank" rel="noopener" class="text-neutral-600 hover:text-neutral-900 transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/></svg>
