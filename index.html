<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Config-Driven Page Title -->
    <title x-text="config.storeName + ' | Minimalist Store'"></title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
        
        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        
        /* 10 Images Marquee - hihinto kapag hinover */
        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 45s linear infinite;
        }
        
        .animate-marquee:hover {
            animation-play-state: paused;
        }
        
        /* Sale Text Marquee - tuloy-tuloy kahit i-hover o i-click */
        .animate-marquee-slow {
            display: flex;
            width: max-content;
            animation: marquee 70s linear infinite;
            animation-play-state: running !important;
        }
    </style>
</head>
<body class="bg-neutral-100 text-neutral-900 antialiased selection:bg-neutral-900 selection:text-white" x-data="storeApp()">
    
    <!-- ===== HEADER ===== -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-neutral-950 transition-transform duration-300 ease-out"
    :class="headerHidden ? '-translate-y-full' : 'translate-y-0'">
    
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between relative z-20">
        
        <!-- LEFT: Desktop Nav / Mobile Hamburger -->
        <div class="flex items-center w-1/3">
            <!-- Mobile Hamburger -->
            <button @click="mobileMenuOpen = !mobileMenuOpen" 
            class="md:hidden text-white focus:outline-none p-1 transition-transform duration-300 active:scale-95">
            <svg class="w-6 h-6 transition-transform duration-300" 
            :class="mobileMenuOpen ? 'rotate-90' : 'rotate-0'" 
            fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
            <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
    
    <!-- Desktop Navigation -->
    <nav class="hidden md:flex items-center space-x-8 text-sm font-bold tracking-[0.15em] uppercase text-white">
        <a href="index.html" class="transition-all duration-300 hover:text-neutral-300 hover:scale-105">Shop</a>
        <a href="#collections" class="transition-all duration-300 hover:text-neutral-300 hover:scale-105">Collections</a>
        <a href="about.html" class="transition-all duration-300 hover:text-neutral-300 hover:scale-105">About</a>
    </nav>
</div>

<!-- CENTER: Logo (config-driven) -->
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10">
    <a href="index.html" class="block transition-all duration-300 hover:opacity-80 hover:scale-105">
        <img :src="config.logo || config.logoWhite" 
        :alt="config.storeName"
        class="h-12 md:h-14 w-auto object-contain">
    </a>
</div>

<!-- RIGHT: Cart -->
<div class="flex items-center justify-end w-1/3">
    <button @click="cartOpen = true" 
    class="relative text-white transition-all duration-300 hover:text-neutral-300 hover:scale-110 active:scale-95 flex items-center">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
    </svg>
    <span class="absolute -top-1.5 -right-2 bg-white text-neutral-950 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center"
    x-text="cartCount">0</span>
</button>
</div>
</div>

<!-- Mobile Menu Dropdown -->
<div x-show="mobileMenuOpen" 
x-transition:enter="transition ease-out duration-300"
x-transition:enter-start="opacity-0 -translate-y-4"
x-transition:enter-end="opacity-100 translate-y-0"
x-transition:leave="transition ease-in duration-200"
x-transition:leave-start="opacity-100 translate-y-0"
x-transition:leave-end="opacity-0 -translate-y-4"
class="md:hidden absolute top-0 left-0 w-full bg-neutral-950 pt-24 px-6 pb-8 border-b border-neutral-800 shadow-2xl z-10" 
style="display: none;">
<nav class="flex flex-col space-y-4 text-base font-bold tracking-[0.15em] uppercase text-white">
    <a href="index.html" @click="mobileMenuOpen = false" class="transition-colors hover:text-neutral-400 py-2 border-b border-neutral-800/50">Shop</a>
    <a href="#collections" @click="mobileMenuOpen = false" class="transition-colors hover:text-neutral-400 py-2 border-b border-neutral-800/50">Collections</a>
    <a href="about.html" @click="mobileMenuOpen = false" class="transition-colors hover:text-neutral-400 py-2">About</a>
</nav>
</div>
</header>

<!-- Hero Section na may hiwalay na Desktop at Mobile Image Sliders -->
<section class="relative h-screen w-full overflow-hidden bg-neutral-900 flex flex-col items-center justify-between py-16">
    
    <!-- DESKTOP SLIDER (Makikita lang sa md screen pataas) -->
    <div class="absolute inset-0 hidden md:block" x-data="{ activeSlide: 0 }" x-init="setInterval(() => activeSlide = (activeSlide + 1) % config.heroImagesDesktop.length, 4000)">
        <template x-for="(img, index) in config.heroImagesDesktop" :key="index">
            <div class="absolute inset-0 transition-opacity duration-1000 ease-in-out"
            :class="activeSlide === index ? 'opacity-100' : 'opacity-0'">
            <img :src="img" class="w-full h-full object-cover opacity-60 scale-105 transform">
        </div>
    </template>
</div>

<!-- MOBILE SLIDER (Makikita lang kapag nasa mobile screen) -->
<div class="absolute inset-0 block md:hidden" x-data="{ activeSlide: 0 }" x-init="setInterval(() => activeSlide = (activeSlide + 1) % config.heroImagesMobile.length, 4000)">
    <template x-for="(img, index) in config.heroImagesMobile" :key="index">
        <div class="absolute inset-0 transition-opacity duration-1000 ease-in-out"
        :class="activeSlide === index ? 'opacity-100' : 'opacity-0'">
        <img :src="img" class="w-full h-full object-cover opacity-60 scale-105 transform">
    </div>
</template>
</div>

<div class="absolute inset-0 bg-gradient-to-t from-neutral-950/80 via-neutral-950/20 to-transparent pointer-events-none"></div>

<!-- Center Text Content -->
<div class="relative z-10 text-center max-w-2xl px-6 text-white my-auto pt-10">
    <p class="text-xs uppercase tracking-widest mb-4 text-neutral-300 font-medium" x-text="config.tagline"></p>
</div>

<!-- Minimalist Bottom Shop Now Link -->
<div class="relative z-10 pb-2">
    <a href="#shop" 
    @click.prevent="document.getElementById('shop').scrollIntoView({ behavior: 'smooth', block: 'start' })"
    class="text-white text-sm md:text-base font-bold tracking-[0.25em] uppercase underline-offset-8 hover:underline transition-all duration-200 active:scale-95 inline-block">
    SHOP NOW
</a>
</div>

</section>

<!-- Text Sale Marquee -->
<div class="overflow-hidden w-full bg-neutral-100 border-b border-neutral-200 py-6">
    <div class="animate-marquee-slow flex items-center space-x-8 text-sm md:text-base font-bold tracking-[0.25em] uppercase">
        <template x-for="i in 4">
            <div class="flex items-center space-x-8 shrink-0">
                <span>SALE! SALE! SALE!</span>
                <span>LIMITED STOCKS</span>
                <span>HOT DROPS</span>
                <span>UP TO 50% OFF</span>
            </div>
        </template>
    </div>
</div>

<!-- Image Marquee (Landscape proportions para hindi ma-cut ang images) -->
<div class="overflow-hidden w-full bg-neutral-100 border-b border-neutral-200 py-6">
    <div class="animate-marquee flex items-center space-x-6">
        <template x-for="i in 2">
            <div class="flex items-center space-x-6 shrink-0">
                <template x-for="img in config.marqueeImages">
                    <div class="w-64 h-40 md:w-96 md:h-56 shrink-0 bg-transparent flex items-center justify-center p-2">
                        <img :src="img" class="w-full h-full object-contain block drop-shadow-md" alt="Brand Marquee Image">
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>

<!-- Main Content / Shop Section -->
<main id="shop" class="max-w-7xl mx-auto px-6 py-20" x-init="initShop()">
    
    <!-- Search & Filter Bar -->
    <div class="flex flex-col md:flex-row justify-between items-center mb-12 gap-4 border-b border-neutral-100 pb-6">
        <div class="flex flex-wrap gap-2">
            <template x-for="cat in categories" :key="cat">
                <button @click="selectedCategory = cat" 
                class="px-5 py-2 text-xs uppercase tracking-wider rounded-full transition-all duration-200"
                :class="selectedCategory === cat ? 'bg-neutral-900 text-white' : 'bg-neutral-100 text-neutral-600 hover:bg-neutral-200'"
                x-text="cat">
            </button>
        </template>
    </div>
    
    <div class="w-full md:w-72">
        <input type="text" x-model="searchQuery" placeholder="Search products..." 
        class="w-full px-4 py-2 text-sm border border-neutral-200 rounded-full focus:outline-none focus:border-neutral-900 transition-colors">
    </div>
</div>

<!-- Product Grid (Config-Driven) -->
<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-8 gap-y-12">
    <template x-for="product in filteredProducts" :key="product.id">
        <div class="group cursor-pointer">
            <!-- Image -->
            <div class="relative bg-neutral-100 overflow-hidden rounded-lg mb-4 aspect-[4/5]" @click="openQuickView(product)">
                <!-- HOT badge -->
                <template x-if="product.hot">
                    <span class="absolute top-3 left-3 z-10 bg-neutral-900 text-white text-[10px] font-bold tracking-[0.2em] uppercase px-2.5 py-1 rounded-sm">
                        Hot
                    </span>
                </template>
                <img :src="product.image_url || config.fallbackImage" 
                :alt="product.name" 
                class="w-full h-full object-contain transition-transform duration-500 group-hover:scale-105">
            </div>
            
            <!-- Name + Price + Add to Cart -->
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0" @click="openQuickView(product)">
                    <h3 class="text-sm font-medium text-neutral-900 mb-0.5 truncate" x-text="product.name"></h3>
                    <p class="text-sm text-neutral-500" x-text="config.currency + Number(product.price).toLocaleString()"></p>
                </div>
                
                <!-- Add to Cart (Text + Icon) -->
                <button @click.stop="addToCart(product)" 
                class="flex-shrink-0 flex items-center gap-1.5 text-[11px] uppercase tracking-wider font-medium text-neutral-900 hover:text-neutral-600 transition-all duration-200 active:scale-90 pt-0.5">
                <span>Add</span>
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
            </button>
        </div>
    </div>
</template>
</div>
</main>

<!-- Quick View Modal -->
<div x-show="quickViewOpen"
x-transition:enter="transition ease-out duration-200"
x-transition:enter-start="opacity-0"
x-transition:enter-end="opacity-100"
x-transition:leave="transition ease-in duration-200"
x-transition:leave-start="opacity-100"
x-transition:leave-end="opacity-0"
class="fixed inset-0 z-[60] overflow-y-auto flex items-center justify-center px-4 py-6 md:py-10"
style="display: none;">

<!-- Backdrop -->
<div @click="closeQuickView()" class="absolute inset-0 bg-neutral-900/60 backdrop-blur-sm"></div>

<template x-if="quickViewProduct">
    <div x-transition:enter="transition duration-300 ease-out"
    x-transition:enter-start="opacity-0 scale-95 translate-y-4"
    x-transition:enter-end="opacity-100 scale-100 translate-y-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95 translate-y-2"
    class="relative bg-white rounded-2xl w-full max-w-lg md:max-w-4xl shadow-2xl z-10 overflow-hidden"
    :class="quickViewClosing ? 'opacity-0 scale-95' : ''">
    
    <!-- Close button -->
    <button @click="closeQuickView()" 
    class="absolute top-4 right-4 z-20 w-9 h-9 rounded-full bg-white/90 backdrop-blur-md text-neutral-900 flex items-center justify-center hover:bg-white transition-colors shadow-md">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
    </svg>
</button>

<!-- Desktop: side-by-side | Mobile: stacked -->
<div class="flex flex-col md:flex-row">
    
    <!-- Image Slider -->
    <div class="relative bg-neutral-50 md:w-1/2 aspect-square md:aspect-auto md:min-h-[420px]">
        <template x-for="(img, index) in (quickViewProduct.images && quickViewProduct.images.length ? quickViewProduct.images : [quickViewProduct.image_url])" :key="index">
            <img :src="img" 
            :alt="quickViewProduct.name"
            x-show="quickViewSlide === index"
            class="absolute inset-0 w-full h-full object-contain p-6">
        </template>
        
        <!-- Arrows + Dots -->
        <template x-if="quickViewProduct.images && quickViewProduct.images.length > 1">
            <div>
                <button @click="prevQuickViewSlide()" 
                class="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 backdrop-blur-md flex items-center justify-center hover:bg-white transition-colors shadow-md">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>
            <button @click="nextQuickViewSlide()" 
            class="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-white/90 backdrop-blur-md flex items-center justify-center hover:bg-white transition-colors shadow-md">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path>
            </svg>
        </button>
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex space-x-2">
            <template x-for="(img, index) in quickViewProduct.images" :key="index">
                <button @click="quickViewSlide = index" 
                class="w-2 h-2 rounded-full transition-colors"
                :class="quickViewSlide === index ? 'bg-neutral-900' : 'bg-neutral-300'"></button>
            </template>
        </div>
    </div>
</template>
</div>

<!-- Product Details -->
<div class="md:w-1/2 p-6 md:p-10 flex flex-col justify-center">
    <p class="text-[11px] uppercase tracking-[0.2em] text-neutral-400 mb-3" x-text="quickViewProduct.category"></p>
    <h3 class="text-xl md:text-2xl font-bold text-neutral-900 mb-2" x-text="quickViewProduct.name"></h3>
    <p class="text-lg text-neutral-700 mb-8" x-text="config.currency + Number(quickViewProduct.price).toLocaleString()"></p>
    
    <button @click="addToCartAndClose(quickViewProduct)" 
    class="w-full bg-neutral-900 text-white text-xs uppercase tracking-wider py-4 rounded-full font-medium hover:bg-neutral-800 transition-all duration-300 active:scale-[0.98]">
    Add to Cart
</button>
</div>
</div>
</div>
</template>
</div>

<!-- Cart Slide-Over Drawer -->
<div x-show="cartOpen" 
x-transition:enter="transition ease-out duration-300"
x-transition:enter-start="opacity-0"
x-transition:enter-end="opacity-100"
x-transition:leave="transition ease-in duration-200"
x-transition:leave-start="opacity-100"
x-transition:leave-end="opacity-0"
class="fixed inset-0 z-50 overflow-hidden" 
style="display: none;">

<!-- Backdrop -->
<div @click="cartOpen = false" class="absolute inset-0 bg-neutral-900/50 backdrop-blur-sm"></div>

<div class="absolute inset-y-0 right-0 max-w-full flex pl-10"
x-show="cartOpen"
x-transition:enter="transition transform ease-out duration-300"
x-transition:enter-start="translate-x-full"
x-transition:enter-end="translate-x-0"
x-transition:leave="transition transform ease-in duration-200"
x-transition:leave-start="translate-x-0"
x-transition:leave-end="translate-x-full">
<div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
    <!-- Drawer Header -->
    <div class="flex items-center justify-between px-6 py-6 border-b border-neutral-100">
        <h2 class="text-base font-medium tracking-wide uppercase">Your Cart (<span x-text="cartCount"></span>)</h2>
        <button @click="cartOpen = false" class="text-neutral-400 hover:text-neutral-900 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>
    
    <!-- Drawer Body (Items List) -->
    <div class="flex-1 overflow-y-auto px-6 py-6 space-y-6">
        <template x-for="item in cart" :key="item.id">
            <div class="flex items-center space-x-4 border-b border-neutral-100 pb-4">
                <img :src="item.image_url || config.fallbackImage" class="w-16 h-20 object-cover rounded bg-neutral-100">
                <div class="flex-1">
                    <h4 class="text-sm font-medium text-neutral-900" x-text="item.name"></h4>
                    <p class="text-xs text-neutral-500 mt-1" x-text="config.currency + Number(item.price).toLocaleString()"></p>
                    <div class="flex items-center space-x-3 mt-2">
                        <button @click="updateQuantity(item.id, -1)" class="w-6 h-6 rounded border border-neutral-200 flex items-center justify-center text-xs hover:bg-neutral-100">-</button>
                        <span class="text-xs font-medium" x-text="item.quantity"></span>
                        <button @click="updateQuantity(item.id, 1)" class="w-6 h-6 rounded border border-neutral-200 flex items-center justify-center text-xs hover:bg-neutral-100">+</button>
                    </div>
                </div>
                <button @click="removeFromCart(item.id)" class="text-xs text-neutral-400 hover:text-neutral-900 transition-colors">Remove</button>
            </div>
        </template>
        <div x-show="cart.length === 0" class="text-center py-12 text-neutral-400 text-sm">
            Your cart is empty.
        </div>
    </div>
    
    <!-- Drawer Footer (Subtotal & Checkout CTA) -->
    <div class="border-t border-neutral-100 px-6 py-6 bg-neutral-50">
        <div class="flex justify-between items-center mb-4">
            <span class="text-sm text-neutral-600">Subtotal</span>
            <span class="text-base font-semibold text-neutral-900" x-text="config.currency + Number(cartTotal).toLocaleString()"></span>
        </div>
        <a href="checkout.html" 
           @click="cartOpen = false"
           :class="cart.length === 0 ? 'opacity-50 pointer-events-none' : ''"
           class="block w-full text-center bg-neutral-900 text-white text-xs uppercase tracking-wider py-4 rounded-full font-medium hover:bg-neutral-800 transition-colors">
            Proceed to Checkout
        </a>
    </div>
</div>
</div>
</div>

<!-- Checkout Modal with GCash Upload -->
<div x-show="checkoutModalOpen" class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center px-4" style="display: none;">
    <!-- Backdrop -->
    <div @click="checkoutModalOpen = false" class="absolute inset-0 bg-neutral-900/50 backdrop-blur-sm"></div>
    
    <div class="relative bg-white rounded-2xl max-w-lg w-full p-8 shadow-2xl z-10 overflow-hidden">
        <div class="flex justify-between items-center mb-6 border-b border-neutral-100 pb-4">
            <h3 class="text-lg font-medium tracking-tight">Checkout Details</h3>
            <button @click="checkoutModalOpen = false" class="text-neutral-400 hover:text-neutral-900">✕</button>
        </div>
        
        <!-- Success State View -->
        <template x-if="orderSuccess">
            <div class="text-center py-8 space-y-4">
                <div class="w-12 h-12 bg-neutral-900 text-white rounded-full flex items-center justify-center mx-auto text-xl">✓</div>
                <h4 class="text-lg font-medium">Order Submitted Successfully!</h4>
                <p class="text-sm text-neutral-500">Naipadala na ang detalye ng order mo. Susuriin na ng ULTI REPS team ang iyong GCash payment.</p>
                <button @click="orderSuccess = false; checkoutModalOpen = false" class="mt-4 bg-neutral-900 text-white text-xs uppercase tracking-wider px-6 py-3 rounded-full">Close</button>
            </div>
        </template>
        
        <!-- Form View -->
        <template x-if="!orderSuccess">
            <form @submit.prevent="submitOrder()" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-neutral-600 mb-1">Full Name</label>
                    <input type="text" x-model="form.name" required class="w-full px-4 py-2.5 text-sm border border-neutral-200 rounded-lg focus:outline-none focus:border-neutral-900">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-neutral-600 mb-1">Complete Delivery Address</label>
                    <textarea x-model="form.address" required rows="2" class="w-full px-4 py-2.5 text-sm border border-neutral-200 rounded-lg focus:outline-none focus:border-neutral-900"></textarea>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-neutral-600 mb-1">Contact Number</label>
                    <input type="text" x-model="form.contact" required class="w-full px-4 py-2.5 text-sm border border-neutral-200 rounded-lg focus:outline-none focus:border-neutral-900">
                </div>
                
                <!-- GCash Upload Box -->
                <div class="pt-2 border-t border-neutral-100">
                    <label class="block text-xs uppercase tracking-wider text-neutral-600 mb-1">Upload GCash Payment Screenshot</label>
                    <input type="file" @change="handleFileUpload($event)" accept="image/*" required class="w-full text-xs text-neutral-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-medium file:bg-neutral-100 file:text-neutral-900 hover:file:bg-neutral-200 cursor-pointer">
                </div>
                
                <div class="pt-4">
                    <button type="submit" :disabled="isSubmitting" class="w-full bg-neutral-900 text-white text-xs uppercase tracking-wider py-4 rounded-full font-medium hover:bg-neutral-800 transition-colors disabled:opacity-50">
                        <span x-show="!isSubmitting">Confirm and Submit Order</span>
                        <span x-show="isSubmitting">Sending Order...</span>
                    </button>
                </div>
            </form>
        </template>
    </div>
</div>

<!-- Footer -->
<footer class="border-t border-neutral-200 bg-neutral-100">
    <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-4">
        
        <!-- Left: Copyright -->
        <p class="text-xs tracking-widest uppercase text-neutral-500 order-2 sm:order-1">
            &copy; 2026 <span x-text="config.storeName"></span>. All rights reserved.
        </p>
        
        <!-- Right: Socials -->
        <div class="flex items-center space-x-5 order-1 sm:order-2">
            <a :href="config.socials.facebook" target="_blank" rel="noopener" 
            class="text-neutral-600 hover:text-neutral-900 transition-colors">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">

<!-- ===== HOT STYLE TOAST (Bottom Right) ===== -->
<div x-show="hotToastVisible"
x-transition:enter="transition ease-out duration-400"
x-transition:enter-start="opacity-0 translate-y-4 translate-x-4"
x-transition:enter-end="opacity-100 translate-y-0 translate-x-0"
x-transition:leave="transition ease-in duration-250"
x-transition:leave-start="opacity-100 translate-y-0"
x-transition:leave-end="opacity-0 translate-y-4"
class="fixed bottom-6 right-6 z-[70] w-[300px] max-w-[calc(100vw-3rem)]"
style="display: none;">

<div class="bg-neutral-950 text-white rounded-xl shadow-2xl overflow-hidden border border-neutral-800">
    <div class="h-1 bg-white/20"></div>
    
    <div class="p-5">
        <div class="flex items-start justify-between gap-3 mb-3">
            <div>
                <p class="text-[10px] uppercase tracking-[0.25em] text-neutral-400 mb-1">Just Dropped</p>
                <h3 class="text-sm font-bold tracking-[0.15em] uppercase">Hot Style</h3>
            </div>
            <button @click="dismissHotToast(false)" 
            class="text-neutral-500 hover:text-white transition-colors p-0.5 -mt-0.5 -mr-0.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>
    
    <p class="text-xs text-neutral-400 leading-relaxed mb-4">
        This week’s hottest colorways just landed. Limited stock.
    </p>
    
    <div class="flex items-center gap-3">
        <button @click="goToHotProducts()" 
        class="flex-1 bg-white text-neutral-950 text-[11px] font-bold tracking-[0.15em] uppercase py-2.5 rounded-lg hover:bg-neutral-200 transition-colors">
        View Hot Styles
    </button>
    <button @click="dismissHotToast(true)" 
    class="text-[10px] uppercase tracking-wider text-neutral-500 hover:text-neutral-300 transition-colors whitespace-nowrap">
    Don’t show
</button>
</div>
</div>
</div>
</div>
