<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title x-text="'Ulti Story | ' + (config.storeName || 'Ulti')">Ulti Story | Ulti</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Google Fonts: Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-neutral-100 text-neutral-900 antialiased selection:bg-neutral-900 selection:text-white flex flex-col min-h-screen"
      x-data="storeApp()" 
      x-init="initHeader()">

<!-- ===== HEADER ===== -->
<header class="fixed top-0 left-0 right-0 z-50 bg-neutral-950 transition-transform duration-300 ease-out"
        :class="headerHidden ? '-translate-y-full' : 'translate-y-0'">

    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between relative z-20">
        
        <!-- LEFT: Desktop Nav / Mobile Hamburger -->
        <div class="flex items-center w-1/3">
            <!-- Mobile Hamburger -->
            <button @click="mobileMenuOpen = !mobileMenuOpen" 
                    class="md:hidden text-white focus:outline-none p-1 transition-transform duration-300 active:scale-95">
                <svg class="w-6 h-6 transition-transform duration-300" 
                     :class="mobileMenuOpen ? 'rotate-90' : 'rotate-0'" 
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path x-show="!mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"></path>
                    <path x-show="mobileMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex items-center space-x-8 text-sm font-bold tracking-[0.15em] uppercase text-white">
                <a href="index.html" class="hover:text-neutral-300 transition-colors">Shop</a>
                <a href="story.html" class="text-white font-bold">Ulti Story</a>
                <a href="about.html" class="hover:text-neutral-300 transition-colors">About</a>
            </nav>
        </div>

        <!-- CENTER: Logo -->
        <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10">
            <a href="index.html" class="block transition-all duration-300 hover:opacity-80 hover:scale-105">
                <img :src="config.logo" 
                     :alt="config.storeName || 'Ulti'"
                     class="h-12 md:h-14 w-auto object-contain">
            </a>
        </div>

        <!-- RIGHT: Cart -->
        <div class="flex items-center justify-end w-1/3">
            <button @click="cartOpen = true" 
                    class="relative text-white transition-all duration-300 hover:text-neutral-300 hover:scale-110 active:scale-95 flex items-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                </svg>
                <span class="absolute -top-1.5 -right-2 bg-white text-neutral-950 text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center"
                      x-text="cartCount">0</span>
            </button>
        </div>
    </div>

    <!-- Mobile Menu -->
    <div x-show="mobileMenuOpen" 
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0 -translate-y-4"
         x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100 translate-y-0"
         x-transition:leave-end="opacity-0 -translate-y-4"
         class="md:hidden absolute top-20 left-0 w-full bg-neutral-950 border-b border-neutral-800 px-6 py-6 shadow-xl"
         style="display: none;">
        <nav class="flex flex-col space-y-4 text-base font-bold tracking-[0.15em] uppercase text-white">
            <a href="index.html" @click="mobileMenuOpen = false" class="transition-colors hover:text-neutral-400 py-2 border-b border-neutral-800/50">Shop</a>
            <a href="story.html" @click="mobileMenuOpen = false" class="transition-colors hover:text-neutral-400 py-2 border-b border-neutral-800/50">Ulti Story</a>
            <a href="about.html" @click="mobileMenuOpen = false" class="transition-colors hover:text-neutral-400 py-2">About</a>
        </nav>
    </div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main class="flex-grow pt-28 pb-0">

    <!-- Page Title -->
    <div class="max-w-7xl mx-auto px-6 mb-10">
        <div class="relative flex py-5 items-center">
            <div class="flex-grow border-t border-neutral-400"></div>
            <span class="flex-shrink mx-6 text-xl md:text-2xl font-bold tracking-[0.25em] uppercase">Ulti Story</span>
            <div class="flex-grow border-t border-neutral-400"></div>
        </div>
    </div>

    <!-- Zero-Gap Image Grid (2 cols desktop / 1 col mobile) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-0">
        <template x-for="(img, index) in (config.storyImages || [])" :key="index">
            <div class="relative overflow-hidden bg-neutral-200 aspect-[3/4]">
                <img :src="img" 
                     :alt="'Ulti Story ' + (index + 1)"
                     class="w-full h-full object-cover transition-transform duration-700 hover:scale-105"
                     loading="lazy">
            </div>
        </template>
    </div>

</main>

<!-- ===== CART SLIDE-OVER DRAWER ===== -->
<div x-show="cartOpen" 
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-50 overflow-hidden" 
     style="display: none;">

    <div @click="cartOpen = false" class="absolute inset-0 bg-neutral-900/50 backdrop-blur-sm"></div>

    <div class="absolute inset-y-0 right-0 max-w-full flex pl-10"
         x-show="cartOpen"
         x-transition:enter="transition transform ease-out duration-300"
         x-transition:enter-start="translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition transform ease-in duration-200"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="translate-x-full">
        <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
            <div class="flex items-center justify-between px-6 py-6 border-b border-neutral-100">
                <h2 class="text-base font-medium tracking-wide uppercase">Your Cart (<span x-text="cartCount"></span>)</h2>
                <button @click="cartOpen = false" class="text-neutral-400 hover:text-neutral-900 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto px-6 py-6 space-y-6">
                <template x-for="item in cart" :key="item.id">
                    <div class="flex items-center space-x-4 border-b border-neutral-100 pb-4">
                        <img :src="item.image_url || config.fallbackImage" class="w-16 h-20 object-cover rounded bg-neutral-100">
                        <div class="flex-1">
                            <h4 class="text-sm font-medium text-neutral-900" x-text="item.name"></h4>
                            <p class="text-xs text-neutral-500 mt-1" x-text="config.currency + Number(item.price).toLocaleString()"></p>
                            <div class="flex items-center space-x-3 mt-2">
                                <button @click="updateQuantity(item.id, -1)" class="w-6 h-6 rounded border border-neutral-200 flex items-center justify-center text-xs hover:bg-neutral-100">-</button>
                                <span class="text-xs font-medium" x-text="item.quantity"></span>
                                <button @click="updateQuantity(item.id, 1)" class="w-6 h-6 rounded border border-neutral-200 flex items-center justify-center text-xs hover:bg-neutral-100">+</button>
                            </div>
                        </div>
                        <button @click="removeFromCart(item.id)" class="text-xs text-neutral-400 hover:text-neutral-900 transition-colors">Remove</button>
                    </div>
                </template>
                <div x-show="cart.length === 0" class="text-center py-12 text-neutral-400 text-sm">
                    Your cart is empty.
                </div>
            </div>
            
            <div class="border-t border-neutral-100 px-6 py-6 bg-neutral-50">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-sm text-neutral-600">Subtotal</span>
                    <span class="text-base font-semibold text-neutral-900" x-text="config.currency + Number(cartTotal).toLocaleString()"></span>
                </div>
                <a href="checkout.html" 
                   @click="cartOpen = false"
                   :class="cart.length === 0 ? 'opacity-50 pointer-events-none' : ''"
                   class="block w-full text-center bg-neutral-900 text-white text-xs uppercase tracking-wider py-4 rounded-full font-medium hover:bg-neutral-800 transition-colors">
                    Proceed to Checkout
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Footer -->
<footer class="border-t border-neutral-200 bg-neutral-100 mt-auto">
    <div class="max-w-7xl mx-auto px-6 py-6 flex flex-col sm:flex-row items-center justify-between gap-4">
        <p class="text-xs tracking-widest uppercase text-neutral-500 order-2 sm:order-1">
            &copy; 2026 <span x-text="config.storeName || 'Ulti'"></span>. All rights reserved.
        </p>
        <div class="flex items-center space-x-5 order-1 sm:order-2">
            <a :href="config.socials.facebook" target="_blank" rel="noopener" class="text-neutral-600 hover:text-neutral-900 transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5 3.66 9.15 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22c4.78-.79 8.44-4.94 8.44-9.94z"/></svg>
            </a>
            <a :href="config.socials.instagram" target="_blank" rel="noopener" class="text-neutral-600 hover:text-neutral-900 transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c2.72 0 3.06.01 4.12.06 1.06.05 1.79.22 2.43.47.66.26 1.22.6 1.77 1.15.55.55.89 1.11 1.15 1.77.25.64.42 1.37.47 2.43.05 1.06.06 1.4.06 4.12s-.01 3.06-.06 4.12c-.05 1.06-.22 1.79-.47 2.43a4.9 4.9 0 01-1.15 1.77 4.9 4.9 0 01-1.77 1.15c-.64.25-1.37.42-2.43.47-1.06.05-1.4.06-4.12.06s-3.06-.01-4.12-.06c-1.06-.05-1.79-.22-2.43-.47a4.9 4.9 0 01-1.77-1.15 4.9 4.9 0 01-1.15-1.77c-.25-.64-.42-1.37-.47-2.43C2.01 15.06 2 14.72 2 12s.01-3.06.06-4.12c.05-1.06.22-1.79.47-2.43.26-.66.6-1.22 1.15-1.77A4.9 4.9 0 015.45.53c.64-.25 1.37-.42 2.43-.47C8.94 2.01 9.28 2 12 2zm0 1.8c-2.67 0-2.99.01-4.04.06-.87.04-1.34.18-1.65.3-.42.16-.71.35-1.03.67-.32.32-.51.61-.67 1.03-.12.31-.26.78-.3 1.65C4.26 8.76 4.25 9.08 4.25 12s.01 3.24.06 4.29c.04.87.18 1.34.3 1.65.16.42.35.71.67 1.03.32.32.61.51 1.03.67.31.12.78.26 1.65.3 1.05.05 1.37.06 4.04.06s2.99-.01 4.04-.06c.87-.04 1.34-.18 1.65-.3.42-.16.71-.35 1.03-.67.32-.32.51-.61.67-1.03.12-.31.26-.78.3-1.65.05-1.05.06-1.37.06-4.29s-.01-3.24-.06-4.29c-.04-.87-.18-1.34-.3-1.65-.16-.42-.35-.71-.67-1.03a2.8 2.8 0 00-1.03-.67c-.31-.12-.78-.26-1.65-.3-1.05-.05-1.37-.06-4.04-.06zM12 7a5 5 0 110 10 5 5 0 010-10zm0 1.8a3.2 3.2 0 100 6.4 3.2 3.2 0 000-6.4zm5.2-2a1.17 1.17 0 110 2.34 1.17 1.17 0 010-2.34z"/></svg>
            </a>
            <a :href="config.socials.tiktok" target="_blank" rel="noopener" class="text-neutral-600 hover:text-neutral-900 transition-colors">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 5.82c-.9-.98-1.4-2.25-1.4-3.62h-3.16v13.4c0 1.5-1.22 2.72-2.72 2.72a2.72 2.72 0 01-2.72-2.72 2.72 2.72 0 012.72-2.72c.28 0 .55.04.8.12V9.6a5.9 5.9 0 00-.8-.06A5.88 5.88 0 003.44 15.4a5.88 5.88 0 005.88 5.88 5.88 5.88 0 005.88-5.88V9.05a8.3 8.3 0 004.86 1.56V7.44a4.85 4.85 0 01-3.46-1.62z"/></svg>
            </a>
        </div>
    </div>
</footer>

<script src="config.js"></script>
<script src="site.js"></script>
</body>
</html>
